# Render the Quarto site (qmd/) and publish it to GitHub Pages on every push to
# main that touches the site, its data, or the package lockfile.
#
# One-time setup in the repo settings: Settings -> Pages -> Source: "GitHub
# Actions". The site reads small files committed under data/ (written by the
# targets pipeline), so no BigQuery credentials are needed here.
name: Render site

on:
  push:
    branches: [main]
    paths:
      - "qmd/**"
      - "data/**"
      - "renv.lock"
      - ".github/workflows/render-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      # System libraries the R packages in renv.lock need on Ubuntu. renv reports
      # anything missing in its "sudo apt install ..." hint when the restore
      # fails; add it here.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev gdal-bin libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Render site
        run: quarto render qmd

      - uses: actions/upload-pages-artifact@v3
        with:
          path: qmd/_site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
