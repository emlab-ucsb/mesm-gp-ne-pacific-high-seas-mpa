project:
  type: website
  output-dir: _site
  # Every push to main publishes whatever is listed here.
  render:
    - index.qmd

website:
  title: "NE Pacific vessel activity"
  site-url: https://emlab-ucsb.github.io/mesm-gp-ne-pacific-high-seas-mpa/
  repo-url: https://github.com/emlab-ucsb/mesm-gp-ne-pacific-high-seas-mpa
  navbar:
    right:
      - icon: github
        href: https://github.com/emlab-ucsb/mesm-gp-ne-pacific-high-seas-mpa

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    code-fold: true
    code-tools: true
    fig-width: 9
    fig-height: 6
    fig-dpi: 150
    embed-resources: true

execute:
  echo: true
  warning: false
  message: false
